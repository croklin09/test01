# Compila el APK de Organizador y lo publica como Release (descargable desde el celular).
# Los runners de GitHub ya traen el Android SDK, así que no hace falta cuenta de Expo/EAS.
name: Organizador APK

on:
  push:
    branches: ['**']
    paths:
      - 'organizador/**'
      - '.github/workflows/organizador-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # para crear la Release con el APK

concurrency:
  group: organizador-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: organizador
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: organizador/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar (typecheck, lint, tests de datos)
        run: |
          npx tsc --noEmit
          npx eslint .
          npm run test:db

      - name: Generar proyecto nativo
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Release firmado con la clave de debug del template de Expo: instalable por fuera de la tienda.
      # Solo arm64-v8a (todos los teléfonos Android actuales) para compilar más rápido y achicar el APK.
      - name: Compilar APK
        working-directory: organizador/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Renombrar APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="organizador-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=organizador-v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: organizador/${{ steps.apk.outputs.name }}

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.name }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Organizador ${{ steps.apk.outputs.tag }}" \
            --notes "APK para Android (arm64). Abrí este link desde el celular, descargá el .apk y permití instalar apps de origen desconocido."
